[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
ffi = false

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 40
fail_on_revert = false

[fmt]
ignore = ["lib/**"]
